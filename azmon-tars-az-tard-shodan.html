<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون ترس از طرد شدن</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;background:#eef5f4;min-height:100vh;color:#333}
.hdr{background:#1A9E8F;color:#fff;text-align:center;padding:20px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hdr h1{font-size:1.3rem;font-weight:700}
.hdr p{font-size:.78rem;margin-top:4px;opacity:.85}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 3px 18px rgba(26,158,143,.1);margin-bottom:12px}
.ttl{font-size:1rem;font-weight:700;color:#1A9E8F;margin-bottom:12px}
.bodytxt{font-size:.93rem;line-height:1.85;color:#444;margin-bottom:16px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#e6f7f5;border-radius:100px;padding:8px 16px;font-size:.8rem;color:#1A9E8F;font-weight:600;margin-bottom:20px}
.lbl{display:block;font-size:.87rem;font-weight:600;color:#555;margin-bottom:8px}
.inp{width:100%;border:2px solid #dde8e7;border-radius:12px;padding:13px 14px;font-family:'Vazirmatn',sans-serif;font-size:.93rem;color:#333;outline:none;transition:border-color .2s;margin-bottom:18px}
.inp:focus{border-color:#1A9E8F}
.inp.err{border-color:#e53935}
.pr{display:flex;justify-content:space-between;font-size:.77rem;color:#888;margin-bottom:7px}
.pt{background:#dce8e7;border-radius:999px;height:8px;overflow:hidden;margin-bottom:20px}
.pf{background:#1A9E8F;height:100%;border-radius:999px;transition:width .4s ease}
.qnum{font-size:.77rem;font-weight:700;color:#1A9E8F;margin-bottom:6px}
.qtxt{font-size:.97rem;font-weight:600;color:#1a1a1a;line-height:1.72;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.opt{display:flex;align-items:center;gap:12px;border:2px solid #e0e8e7;border-radius:12px;padding:12px 15px;cursor:pointer;font-size:.9rem;color:#444;transition:all .18s;-webkit-user-select:none;user-select:none}
.opt:hover{border-color:#1A9E8F;background:#f0faf9}
.opt.picked{border-color:#1A9E8F;background:#1A9E8F;color:#fff;font-weight:600}
.rr{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.picked .rr::after{content:'';display:block;width:9px;height:9px;border-radius:50%;background:#fff}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:13px;font-family:'Vazirmatn',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;background:#1A9E8F;color:#fff;transition:background .2s,transform .15s}
.btn:hover:not(:disabled){background:#158577;transform:translateY(-1px)}
.btn:disabled{background:#bdc9c8;cursor:not-allowed;transform:none}
.ri{font-size:3rem;text-align:center;margin-bottom:14px}
.rl{font-size:1.12rem;font-weight:700;color:#1A9E8F;text-align:center;margin-bottom:6px}
.rs{font-size:.84rem;color:#888;text-align:center;margin-bottom:16px}
.rd{font-size:.92rem;line-height:1.85;color:#444;text-align:center;margin-bottom:22px}
.okbox{background:#e6f7f5;border:1px solid #aaddd7;border-radius:12px;padding:12px 16px;text-align:center;font-size:.84rem;font-weight:600;color:#1A9E8F}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="hdr">
  <h1>آزمون ترس از طرد شدن</h1>
  <p>نوشین منصوری</p>
</div>

<div class="wrap">

  <div id="sw" class="card">
    <div class="ttl">&#x2728; خوش آمدید</div>
    <div class="bodytxt">این یک آزمون خودیاری است و هیچ ارزش درمانی ندارد. پس خود را قضاوت نکنید و با شفقت کامل نسبت به خود در این آزمون شرکت کنید.</div>
    <div class="badge">&#x1F4CB; ۷ سوال &nbsp;|&nbsp; &#x23F1; حدود ۳ دقیقه</div>
    <br>
    <button class="btn" onclick="goStage('si')">شروع آزمون</button>
  </div>

  <div id="si" class="card hidden">
    <div class="ttl">&#x1F464; اطلاعات شخصی</div>
    <label class="lbl" for="fname">نام و نام خانوادگی</label>
    <input class="inp" type="text" id="fname" placeholder="مثال: زهرا احمدی">
    <button class="btn" onclick="startQ()">بعدی</button>
  </div>

  <div id="sq" class="hidden">
    <div class="pr">
      <span id="pl">سوال ۱ از ۷</span>
      <span id="pp">۱۴٪</span>
    </div>
    <div class="pt"><div class="pf" id="pf" style="width:14%"></div></div>
    <div class="card">
      <div class="qnum" id="qnum"></div>
      <div class="qtxt" id="qtxt"></div>
      <div class="opts" id="qopts"></div>
      <button class="btn" id="bnext" onclick="nxt()" disabled>بعدی</button>
    </div>
  </div>

  <div id="sr" class="card hidden">
    <div class="ri" id="ri"></div>
    <div class="rl" id="rl"></div>
    <div class="rs" id="rs"></div>
    <div class="rd" id="rd"></div>
    <div class="okbox">&#x2705; اطلاعات آزمون شما به‌درستی ثبت شد</div>
  </div>

</div>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhEZaA1kQFxDpxe9eqFl6rmbKgt8ZbPqSQTXWOBBKgppTx-6gfSiIozLdHcQLJHUw/exec";
var SHEET = "azmon-tars-az-tard-shodan";

var QUESTIONS = [
  "\u0648\u0642\u062a\u06cc \u0645\u06cc\u200c\u062e\u0648\u0627\u0647\u0645 \u0627\u0632 \u06a9\u0633\u06cc \u0686\u06cc\u0632\u06cc \u0628\u062e\u0648\u0627\u0647\u0645\u060c \u0646\u06af\u0631\u0627\u0646 \u00ab\u0646\u0647\u00bb \u0634\u0646\u06cc\u062f\u0646 \u0647\u0633\u062a\u0645.",
  "\u0627\u0632 \u0628\u06cc\u0627\u0646 \u0627\u062d\u0633\u0627\u0633\u0627\u062a \u0648\u0627\u0642\u0639\u06cc\u200c\u0627\u0645 \u0645\u06cc\u200c\u062a\u0631\u0633\u0645 \u0686\u0648\u0646 \u0645\u0645\u06a9\u0646 \u0627\u0633\u062a \u062f\u06cc\u06af\u0631\u0627\u0646 \u0645\u0631\u0627 \u0646\u067e\u0630\u06cc\u0631\u0646\u062f.",
  "\u0628\u0631\u0627\u06cc \u062c\u0644\u0628 \u062a\u0623\u06cc\u06cc\u062f \u062f\u06cc\u06af\u0631\u0627\u0646\u060c \u06af\u0627\u0647\u06cc \u0646\u0638\u0631 \u0648\u0627\u0642\u0639\u06cc\u200c\u0627\u0645 \u0631\u0627 \u067e\u0646\u0647\u0627\u0646 \u0645\u06cc\u200c\u06a9\u0646\u0645.",
  "\u0648\u0642\u062a\u06cc \u06a9\u0633\u06cc \u0628\u0627 \u0645\u0646 \u0645\u062e\u0627\u0644\u0641\u062a \u0645\u06cc\u200c\u06a9\u0646\u062f\u060c \u0627\u062d\u0633\u0627\u0633 \u0645\u06cc\u200c\u06a9\u0646\u0645 \u06a9\u0647 \u0645\u0631\u0627 \u0631\u062f \u06a9\u0631\u062f\u0647 \u0627\u0633\u062a.",
  "\u0627\u0632 \u0634\u0631\u0648\u0639 \u0631\u0648\u0627\u0628\u0637 \u062c\u062f\u06cc\u062f \u0627\u062c\u062a\u0646\u0627\u0628 \u0645\u06cc\u200c\u06a9\u0646\u0645 \u0686\u0648\u0646 \u0645\u06cc\u200c\u062a\u0631\u0633\u0645 \u062f\u0631 \u0646\u0647\u0627\u06cc\u062a \u0637\u0631\u062f \u0634\u0648\u0645.",
  "\u0627\u06af\u0631 \u06a9\u0633\u06cc \u0648\u0642\u062a \u06a9\u0627\u0641\u06cc \u0628\u0631\u0627\u06cc\u0645 \u0646\u062f\u0627\u0634\u062a\u0647 \u0628\u0627\u0634\u062f\u060c \u0641\u06a9\u0631 \u0645\u06cc\u200c\u06a9\u0646\u0645 \u062f\u06cc\u06af\u0631 \u062f\u0648\u0633\u062a\u0645 \u0646\u062f\u0627\u0631\u062f.",
  "\u0628\u0631\u0627\u06cc \u067e\u0630\u06cc\u0631\u0641\u062a\u0647 \u0634\u062f\u0646\u060c \u0646\u06cc\u0627\u0632\u0647\u0627 \u0648 \u062e\u0648\u0627\u0633\u062a\u0647\u200c\u0647\u0627\u06cc\u0645 \u0631\u0627 \u0641\u062f\u0627 \u0645\u06cc\u200c\u06a9\u0646\u0645."
];

var OPTIONS = [
  {label: "\u0627\u0635\u0644\u0627\u064b", value: 1},
  {label: "\u0628\u0647\u200c\u0646\u062f\u0631\u062a", value: 2},
  {label: "\u06af\u0627\u0647\u06cc", value: 3},
  {label: "\u0627\u063a\u0644\u0628", value: 4},
  {label: "\u0647\u0645\u06cc\u0634\u0647", value: 5}
];

var LEVELS = [
  {
    min: 7, max: 14,
    icon: "\uD83C\uDF3F",
    label: "\u062a\u0631\u0633 \u0627\u0632 \u0637\u0631\u062f \u0634\u062f\u0646 \u067e\u0627\u06cc\u06cc\u0646",
    desc: "\u0633\u0637\u062d \u062a\u0631\u0633 \u0627\u0632 \u0637\u0631\u062f \u0634\u062f\u0646 \u062f\u0631 \u0634\u0645\u0627 \u067e\u0627\u06cc\u06cc\u0646 \u0627\u0633\u062a. \u0628\u0647\u200c\u0637\u0648\u0631 \u06a9\u0644\u06cc \u062f\u0631 \u0631\u0648\u0627\u0628\u0637\u062a\u0627\u0646 \u0627\u062d\u0633\u0627\u0633 \u0627\u0645\u0646\u06cc\u062a \u0645\u06cc\u200c\u06a9\u0646\u06cc\u062f \u0648 \u0646\u06af\u0631\u0627\u0646\u06cc \u0686\u0646\u062f\u0627\u0646\u06cc \u0628\u0631\u0627\u06cc \u0637\u0631\u062f \u0634\u062f\u0646 \u0646\u062f\u0627\u0631\u06cc\u062f. \u0627\u06cc\u0646 \u0648\u06cc\u0698\u06af\u06cc \u0628\u0647 \u0634\u0645\u0627 \u06a9\u0645\u06a9 \u0645\u06cc\u200c\u06a9\u0646\u062f \u0631\u0648\u0627\u0628\u0637\u06cc \u0635\u0627\u062f\u0642\u0627\u0646\u0647\u200c\u062a\u0631 \u0648 \u0622\u0632\u0627\u062f\u0627\u0646\u0647\u200c\u062a\u0631 \u062f\u0627\u0634\u062a\u0647 \u0628\u0627\u0634\u06cc\u062f."
  },
  {
    min: 15, max: 21,
    icon: "\uD83C\uDF3B",
    label: "\u062a\u0631\u0633 \u0627\u0632 \u0637\u0631\u062f \u0634\u062f\u0646 \u0645\u062a\u0648\u0633\u0637",
    desc: "\u0633\u0637\u062d \u062a\u0631\u0633 \u0627\u0632 \u0637\u0631\u062f \u0634\u062f\u0646 \u062f\u0631 \u0634\u0645\u0627 \u0645\u062a\u0648\u0633\u0637 \u0627\u0633\u062a. \u06af\u0627\u0647\u06cc \u0646\u06af\u0631\u0627\u0646\u06cc\u200c\u0647\u0627\u06cc\u06cc \u062f\u0631\u0628\u0627\u0631\u0647 \u067e\u0630\u06cc\u0631\u0641\u062a\u0647 \u0634\u062f\u0646 \u062f\u0627\u0631\u06cc\u062f\u060c \u0627\u0645\u0627 \u0627\u06cc\u0646 \u0646\u06af\u0631\u0627\u0646\u06cc\u200c\u0647\u0627 \u0632\u0646\u062f\u06af\u06cc \u0631\u0648\u0632\u0645\u0631\u0647\u200c\u062a\u0627\u0646 \u0631\u0627 \u0628\u0647\u200c\u0637\u0648\u0631 \u062c\u062f\u06cc \u062a\u062d\u062a\u200c\u062a\u0623\u062b\u06cc\u0631 \u0642\u0631\u0627\u0631 \u0646\u0645\u06cc\u200c\u062f\u0647\u062f. \u062a\u0648\u062c\u0647 \u0628\u0647 \u0645\u0631\u0632\u0647\u0627\u06cc \u0633\u0627\u0644\u0645 \u062f\u0631 \u0631\u0648\u0627\u0628\u0637 \u0645\u06cc\u200c\u062a\u0648\u0627\u0646\u062f \u0645\u0641\u06cc\u062f \u0628\u0627\u0634\u062f."
  },
  {
    min: 22, max: 28,
    icon: "\uD83C\uDF0A",
    label: "\u062a\u0631\u0633 \u0627\u0632 \u0637\u0631\u062f \u0634\u062f\u0646 \u0646\u0633\u0628\u062a\u0627\u064b \u0628\u0627\u0644\u0627",
    desc: "\u0633\u0637\u062d \u062a\u0631\u0633 \u0627\u0632 \u0637\u0631\u062f \u0634\u062f\u0646 \u062f\u0631 \u0634\u0645\u0627 \u0646\u0633\u0628\u062a\u0627\u064b \u0628\u0627\u0644\u0627\u0633\u062a. \u0627\u06cc\u0646 \u062a\u0631\u0633 \u0645\u0645\u06a9\u0646 \u0627\u0633\u062a \u06af\u0627\u0647\u06cc \u0634\u0645\u0627 \u0631\u0627 \u0627\u0632 \u0628\u06cc\u0627\u0646 \u0646\u06cc\u0627\u0632\u0647\u0627 \u0648 \u0627\u062d\u0633\u0627\u0633\u0627\u062a \u0648\u0627\u0642\u0639\u06cc\u200c\u062a\u0627\u0646 \u0628\u0627\u0632 \u062f\u0627\u0631\u062f. \u062a\u0645\u0631\u06cc\u0646 \u0634\u0641\u0642\u062a \u0628\u0647 \u062e\u0648\u062f \u0648 \u06a9\u0627\u0631 \u0631\u0648\u06cc \u0639\u0632\u062a \u0646\u0641\u0633 \u0645\u06cc\u200c\u062a\u0648\u0627\u0646\u062f \u062f\u0631 \u06a9\u0627\u0647\u0634 \u0627\u06cc\u0646 \u0627\u0636\u0637\u0631\u0627\u0628 \u06a9\u0645\u06a9\u200c\u06a9\u0646\u0646\u062f\u0647 \u0628\u0627\u0634\u062f."
  },
  {
    min: 29, max: 35,
    icon: "\uD83D\uDC99",
    label: "\u062a\u0631\u0633 \u0627\u0632 \u0637\u0631\u062f \u0634\u062f\u0646 \u0628\u0627\u0644\u0627",
    desc: "\u0633\u0637\u062d \u062a\u0631\u0633 \u0627\u0632 \u0637\u0631\u062f \u0634\u062f\u0646 \u062f\u0631 \u0634\u0645\u0627 \u0628\u0627\u0644\u0627\u0633\u062a. \u0627\u06cc\u0646 \u062a\u0631\u0633 \u0645\u0645\u06a9\u0646 \u0627\u0633\u062a \u0628\u0647\u200c\u0637\u0648\u0631 \u0642\u0627\u0628\u0644\u200c\u062a\u0648\u062c\u0647\u06cc \u0628\u0631 \u0631\u0648\u0627\u0628\u0637 \u0648 \u062a\u0635\u0645\u06cc\u0645\u200c\u06af\u06cc\u0631\u06cc\u200c\u0647\u0627\u06cc\u062a\u0627\u0646 \u062a\u0623\u062b\u06cc\u0631 \u0628\u06af\u0630\u0627\u0631\u062f. \u0628\u0627 \u0634\u0641\u0642\u062a \u0628\u0647 \u062e\u0648\u062f \u0628\u062f\u0627\u0646\u06cc\u062f \u06a9\u0647 \u0627\u06cc\u0646 \u0627\u062d\u0633\u0627\u0633 \u0628\u062e\u0634\u06cc \u0627\u0632 \u062a\u062c\u0631\u0628\u0647 \u0627\u0646\u0633\u0627\u0646\u06cc \u0627\u0633\u062a \u0648 \u0628\u0627 \u0622\u06af\u0627\u0647\u06cc \u0648 \u062a\u0645\u0631\u06cc\u0646 \u0645\u06cc\u200c\u062a\u0648\u0627\u0646 \u0622\u0646 \u0631\u0627 \u06a9\u0627\u0647\u0634 \u062f\u0627\u062f."
  }
];

var FARSI = "\u06F0\u06F1\u06F2\u06F3\u06F4\u06F5\u06F6\u06F7\u06F8\u06F9";
function toFa(n) {
  return ("" + n).replace(/\d/g, function(d) { return FARSI[d]; });
}

var cur = 0;
var answers = [];
var userName = "";
var activeStage = "sw";

function goStage(id) {
  document.getElementById(activeStage).classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");
  activeStage = id;
}

function startQ() {
  var v = document.getElementById("fname").value.trim();
  if (!v) {
    document.getElementById("fname").classList.add("err");
    document.getElementById("fname").focus();
    return;
  }
  userName = v;
  goStage("sq");
  renderQ();
}

function renderQ() {
  var total = QUESTIONS.length;
  var pct = Math.round((cur + 1) / total * 100);
  document.getElementById("qnum").textContent = "\u0633\u0648\u0627\u0644 " + toFa(cur + 1);
  document.getElementById("qtxt").textContent = QUESTIONS[cur];
  document.getElementById("pl").textContent = "\u0633\u0648\u0627\u0644 " + toFa(cur + 1) + " \u0627\u0632 " + toFa(total);
  document.getElementById("pp").textContent = toFa(pct) + "\u066A";
  document.getElementById("pf").style.width = pct + "%";
  var box = document.getElementById("qopts");
  box.innerHTML = "";
  for (var i = 0; i < OPTIONS.length; i++) {
    (function(opt) {
      var div = document.createElement("div");
      div.className = "opt" + (answers[cur] === opt.value ? " picked" : "");
      div.innerHTML = '<div class="rr"></div><span>' + opt.label + "</span>";
      div.addEventListener("click", function() {
        answers[cur] = opt.value;
        renderQ();
      });
      box.appendChild(div);
    })(OPTIONS[i]);
  }
  document.getElementById("bnext").disabled = (answers[cur] === undefined);
}

function nxt() {
  if (answers[cur] === undefined) return;
  if (cur < QUESTIONS.length - 1) {
    cur++;
    renderQ();
  } else {
    showResult();
  }
}

function showResult() {
  goStage("sr");
  var total = 0;
  for (var i = 0; i < answers.length; i++) { total += answers[i]; }
  var level = null;
  for (var i = 0; i < LEVELS.length; i++) {
    if (total >= LEVELS[i].min && total <= LEVELS[i].max) {
      level = LEVELS[i];
      break;
    }
  }
  document.getElementById("ri").textContent = level.icon;
  document.getElementById("rl").textContent = level.label;
  document.getElementById("rs").textContent = "\u0646\u0645\u0631\u0647 \u0634\u0645\u0627: " + toFa(total) + " \u0627\u0632 " + toFa(35);
  document.getElementById("rd").textContent = level.desc;
  var payload = { sheet: SHEET };
  payload["\u0646\u0627\u0645"] = userName;
  payload["\u062a\u0627\u0631\u06cc\u062e"] = new Date().toLocaleString("fa-IR");
  for (var i = 0; i < QUESTIONS.length; i++) {
    payload["\u0633" + (i + 1)] = answers[i];
  }
  payload["\u0646\u0645\u0631\u0647_\u06a9\u0644"] = total;
  payload["\u0633\u0637\u062d"] = level.label;
  fetch(SCRIPT_URL + "?payload=" + encodeURIComponent(JSON.stringify(payload)), {mode: "no-cors"});
}
</script>

</body>
</html>
